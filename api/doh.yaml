openapi: 3.0.3
info:
  title: KDNS DNS-over-HTTPS (DoH) API
  description: |
    RFC 8484 Web Standard DNS Queries over HTTPS specification for the KDNS Data Plane.
    Dedicated, zero-allocation listener serving `/dns-query` and Kubernetes probes (`/livez`, `/readyz`, `/startupz`) on port **:8443**.
  version: 1.0.0
  license:
    name: BSD 3-Clause
    url: https://opensource.org/licenses/BSD-3-Clause

servers:
  - url: https://localhost:8443
    description: Dedicated DoH Data Plane Listener (RFC 8484)

tags:
  - name: DNS over HTTPS
    description: RFC 8484 DNS binary wire resolution over HTTPS.
  - name: Health
    description: Dedicated DoH listener health probe.

paths:
  /dns-query:
    get:
      tags:
        - DNS over HTTPS
      summary: DoH query via GET (RFC 8484 §4.1.1)
      description: Executes a DNS query with the binary wire message encoded in the `dns` query parameter using base64url without padding.
      parameters:
        - name: dns
          in: query
          description: Base64url-encoded binary DNS query packet.
          required: true
          schema:
            type: string
            example: "AAABAAABAAAAAAAAB3d3dwdleGFtcGxlA2NvbQAAAQAB"
      responses:
        '200':
          description: DNS binary wire response packet.
          headers:
            Cache-Control:
              schema:
                type: string
                example: "max-age=300"
              description: Dynamic cache control header matching minimum record TTL.
            Content-Type:
              schema:
                type: string
                example: "application/dns-message"
          content:
            application/dns-message:
              schema:
                type: string
                format: binary
        '400':
          description: Invalid base64url or malformed DNS wire packet.
        '405':
          description: Method not allowed.

    post:
      tags:
        - DNS over HTTPS
      summary: DoH query via POST (RFC 8484 §4.1.2)
      description: Executes a DNS query with the raw binary wire packet in the HTTP request body.
      requestBody:
        required: true
        content:
          application/dns-message:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: DNS binary wire response packet.
          headers:
            Cache-Control:
              schema:
                type: string
                example: "max-age=300"
              description: Dynamic cache control header matching minimum record TTL.
            Content-Type:
              schema:
                type: string
                example: "application/dns-message"
          content:
            application/dns-message:
              schema:
                type: string
                format: binary
        '400':
          description: Malformed DNS wire packet or empty body.
        '415':
          description: Unsupported media type (Content-Type must be application/dns-message).

  /livez:
    get:
      tags:
        - Health
      summary: DoH listener liveness probe
      description: Returns 200 OK indicating the dedicated DoH listener is active and serving traffic.
      responses:
        '200':
          description: DoH server process is alive.
          content:
            text/plain:
              schema:
                type: string
                example: "ok\n"

  /startupz:
    get:
      tags:
        - Health
      summary: DoH listener startup probe
      description: Returns 200 OK indicating the DoH server initialization is complete.
      responses:
        '200':
          description: DoH server initialization is complete.
          content:
            text/plain:
              schema:
                type: string
                example: "ok\n"

  /readyz:
    get:
      tags:
        - Health
      summary: DoH listener readiness probe
      description: Returns 200 OK indicating the DoH server is ready to resolve queries.
      responses:
        '200':
          description: DoH server is ready to receive traffic.
          content:
            text/plain:
              schema:
                type: string
                example: "ok\n"
