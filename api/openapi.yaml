openapi: 3.0.3
info:
  title: KDNS Unified API Specification
  description: |
    Formal OpenAPI 3.0.3 specification for the KDNS Authoritative DNS Server.
    Covers all three network planes:
    - **Control Plane (`:8080`)**: Zone and record management, cursor pagination, substring search, BIND export, Kubernetes probes, and Prometheus metrics.
    - **Data Plane (`:8443`)**: RFC 8484 DNS-over-HTTPS (`/dns-query`) and dedicated DoH listener probes.
    - **Cluster Plane (`:8081`)**: High Availability Write-Ahead Log (WAL) streaming and snapshot replication.
  version: 1.0.0
  license:
    name: BSD 3-Clause
    url: https://opensource.org/licenses/BSD-3-Clause

servers:
  - url: http://127.0.0.1:8080
    description: Control Plane (Management, Probes & Metrics)
  - url: https://127.0.0.1:8443
    description: Data Plane (RFC 8484 DNS-over-HTTPS)
  - url: http://127.0.0.1:8081
    description: Cluster Plane (HA Streaming & Snapshot Replication)

tags:
  - name: Zone Management
    description: Endpoints for inspecting, adding, modifying, searching, and deleting DNS resource records on port :8080.
  - name: DNS over HTTPS
    description: RFC 8484 Web Standard binary wire DNS query resolution on dedicated port :8443.
  - name: Cluster Replication
    description: High Availability Primary/Replica WAL streaming and snapshot synchronization on port :8081.
  - name: Health & Telemetry
    description: Operational health probes (Kubernetes liveness, startup, and readiness) and Prometheus metrics exporter.

paths:
  # =========================================================================
  # Control Plane: Health & Telemetry (:8080)
  # =========================================================================
  /livez:
    get:
      operationId: getLivenessProbe
      tags:
        - Health & Telemetry
      summary: Control plane liveness probe
      description: Returns 200 OK indicating the KDNS process is active and not deadlocked.
      security: []
      servers:
        - url: http://127.0.0.1:8080
          description: Control Plane listener
        - url: https://127.0.0.1:8443
          description: DoH Data Plane listener
      responses:
        '200':
          description: Process is alive and healthy.
          content:
            text/plain:
              schema:
                type: string
                example: "ok\n"
        '405':
          $ref: '#/components/responses/MethodNotAllowedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /startupz:
    get:
      operationId: getStartupProbe
      tags:
        - Health & Telemetry
      summary: Control plane startup probe
      description: Returns 200 OK indicating that server initialization, zone loading, and storage bootstrap have finished.
      security: []
      servers:
        - url: http://127.0.0.1:8080
          description: Control Plane listener
        - url: https://127.0.0.1:8443
          description: DoH Data Plane listener
      responses:
        '200':
          description: Server startup is complete.
          content:
            text/plain:
              schema:
                type: string
                example: "ok\n"
        '405':
          $ref: '#/components/responses/MethodNotAllowedError'
        '503':
          description: Server is still initializing storage state.
          content:
            text/plain:
              schema:
                type: string
                example: "initializing\n"

  /readyz:
    get:
      operationId: getReadinessProbe
      tags:
        - Health & Telemetry
      summary: Control plane readiness probe
      description: Returns 200 OK when ready to serve DNS and API traffic. In Replica mode, returns 503 Service Unavailable until the first snapshot sync completes.
      security: []
      servers:
        - url: http://127.0.0.1:8080
          description: Control Plane listener
        - url: https://127.0.0.1:8443
          description: DoH Data Plane listener
      responses:
        '200':
          description: Server is ready to receive traffic.
          content:
            text/plain:
              schema:
                type: string
                example: "ok\n"
        '405':
          $ref: '#/components/responses/MethodNotAllowedError'
        '503':
          description: Server is syncing initial state and not yet ready for traffic.
          content:
            text/plain:
              schema:
                type: string
                example: "syncing\n"

  /metrics:
    get:
      operationId: getPrometheusMetrics
      tags:
        - Health & Telemetry
      summary: Prometheus metrics endpoint
      description: Exports runtime, query, transport, and storage telemetry in standard Prometheus text format (version 0.0.4).
      security: []
      servers:
        - url: http://127.0.0.1:8080
          description: Control Plane listener
      responses:
        '200':
          description: Prometheus metrics exposition stream.
          content:
            text/plain; version=0.0.4:
              schema:
                type: string
        '405':
          $ref: '#/components/responses/MethodNotAllowedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # =========================================================================
  # Control Plane: Zone & Record Management (:8080)
  # =========================================================================
  /v1/records:
    get:
      operationId: listRecords
      tags:
        - Zone Management
      summary: List all domain records (paginated)
      description: Sequentially traverses domain records in lexicographical order using seek cursor pagination.
      servers:
        - url: http://127.0.0.1:8080
          description: Control Plane listener
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
        - {}
      parameters:
        - name: limit
          in: query
          description: Maximum number of domains to return (default 100, max 1000).
          required: false
          schema:
            type: integer
            default: 100
            minimum: 1
            maximum: 1000
        - name: cursor
          in: query
          description: Seek cursor (domain name) to paginate records strictly after this key.
          required: false
          schema:
            type: string
            example: "example.com"
      responses:
        '200':
          description: Paginated list of domain records.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /v1/records/search:
    get:
      operationId: searchRecords
      tags:
        - Zone Management
      summary: Search domain records by substring
      description: Performs a lock-free substring scan across all domain names hosted in memory.
      servers:
        - url: http://127.0.0.1:8080
          description: Control Plane listener
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
        - {}
      parameters:
        - name: q
          in: query
          description: Search query substring.
          required: true
          schema:
            type: string
            example: "api"
        - name: limit
          in: query
          description: Maximum number of matching domains to return (default 100, max 1000).
          required: false
          schema:
            type: integer
            default: 100
      responses:
        '200':
          description: Matching domain records.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /v1/records/{domain}:
    get:
      operationId: getDomainRecords
      tags:
        - Zone Management
      summary: Get records for a domain
      description: Returns all resource record sets configured for the specified domain name.
      servers:
        - url: http://127.0.0.1:8080
          description: Control Plane listener
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
        - {}
      parameters:
        - name: domain
          in: path
          description: Fully-qualified domain name (FQDN).
          required: true
          schema:
            type: string
            example: "app.example.com"
      responses:
        '200':
          description: Domain records found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainRecords'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

    put:
      operationId: putDomainRecords
      tags:
        - Zone Management
      summary: Create or replace domain records
      description: |
        Atomically replaces all record sets for the specified domain.
        In Replica mode, this endpoint returns 403 Forbidden.
      servers:
        - url: http://127.0.0.1:8080
          description: Control Plane listener
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
        - {}
      parameters:
        - name: domain
          in: path
          description: Fully-qualified domain name (FQDN).
          required: true
          schema:
            type: string
            example: "app.example.com"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertRequest'
      responses:
        '200':
          description: Domain records successfully updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenReplicaError'

    post:
      operationId: postDomainRecords
      tags:
        - Zone Management
      summary: Create or replace domain records (alias for PUT)
      description: Convenience alias for PUT /v1/records/{domain}.
      servers:
        - url: http://127.0.0.1:8080
          description: Control Plane listener
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
        - {}
      parameters:
        - name: domain
          in: path
          description: Fully-qualified domain name (FQDN).
          required: true
          schema:
            type: string
            example: "app.example.com"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertRequest'
      responses:
        '200':
          description: Domain records successfully updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenReplicaError'

    delete:
      operationId: deleteDomainRecords
      tags:
        - Zone Management
      summary: Delete domain records
      description: |
        Completely deletes all resource records associated with the specified domain.
        In Replica mode, this endpoint returns 403 Forbidden.
      servers:
        - url: http://127.0.0.1:8080
          description: Control Plane listener
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
        - {}
      parameters:
        - name: domain
          in: path
          description: Fully-qualified domain name (FQDN).
          required: true
          schema:
            type: string
            example: "app.example.com"
      responses:
        '200':
          description: Domain records deleted successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenReplicaError'

  /v1/export/zonefile:
    get:
      operationId: exportZoneFile
      tags:
        - Zone Management
      summary: Export database or zone in RFC 1035 master zone file format
      description: |
        Streams DNS resource records formatted as an RFC 1035 compliant Master Zone File (BIND format).
        If the `zone` query parameter is omitted, all zones in the database are exported.
        If `zone` is specified, only records belonging to that zone are exported.
        This endpoint is supported on both Primary and Replica nodes.
      servers:
        - url: http://127.0.0.1:8080
          description: Control Plane listener
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
        - {}
      parameters:
        - name: zone
          in: query
          description: Optional zone apex domain name to filter the export (e.g. `example.com`).
          required: false
          schema:
            type: string
            example: "example.com"
      responses:
        '200':
          description: RFC 1035 Master Zone File stream.
          headers:
            Content-Disposition:
              schema:
                type: string
                example: 'inline; filename="example.com.zone"'
          content:
            text/dns; charset=utf-8:
              schema:
                type: string
                example: |
                  $ORIGIN example.com.
                  $TTL 3600

                  example.com.                  3600    IN      SOA     ns1.example.com. hostmaster.example.com. 2026082701 7200 3600 1209600 300
                  example.com.                  3600    IN      NS      ns1.example.com.
                  example.com.                  3600    IN      A       192.0.2.1
                  www.example.com.              300     IN      A       192.0.2.10
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  # =========================================================================
  # Data Plane: DNS over HTTPS (DoH RFC 8484 on :8443)
  # =========================================================================
  /dns-query:
    get:
      operationId: dohQueryGet
      tags:
        - DNS over HTTPS
      summary: DoH query via GET (RFC 8484 §4.1.1)
      description: Executes a DNS query with the binary wire message encoded in the `dns` query parameter using base64url without padding.
      servers:
        - url: https://127.0.0.1:8443
          description: DoH Data Plane listener
      security: []
      parameters:
        - name: dns
          in: query
          description: Base64url-encoded binary DNS query packet.
          required: true
          schema:
            type: string
            example: "AAABAAABAAAAAAAAB3d3dwdleGFtcGxlA2NvbQAAAQAB"
      responses:
        '200':
          description: DNS binary wire response packet.
          headers:
            Cache-Control:
              schema:
                type: string
                example: "max-age=300"
              description: Dynamic cache control header matching minimum record TTL.
            Content-Type:
              schema:
                type: string
                example: "application/dns-message"
          content:
            application/dns-message:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequestError'
        '405':
          description: Method not allowed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      operationId: dohQueryPost
      tags:
        - DNS over HTTPS
      summary: DoH query via POST (RFC 8484 §4.1.2)
      description: Executes a DNS query with the raw binary wire packet in the HTTP request body.
      servers:
        - url: https://127.0.0.1:8443
          description: DoH Data Plane listener
      security: []
      requestBody:
        required: true
        content:
          application/dns-message:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: DNS binary wire response packet.
          headers:
            Cache-Control:
              schema:
                type: string
                example: "max-age=300"
              description: Dynamic cache control header matching minimum record TTL.
            Content-Type:
              schema:
                type: string
                example: "application/dns-message"
          content:
            application/dns-message:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequestError'
        '415':
          description: Unsupported media type (Content-Type must be application/dns-message).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # =========================================================================
  # Cluster Plane: High Availability Replication (:8081)
  # =========================================================================
  /v1/cluster/snapshot:
    get:
      operationId: getClusterSnapshot
      tags:
        - Cluster Replication
      summary: Download complete baseline state snapshot
      description: |
        Streams the raw compressed `state.snap` file with its SHA-256 / CRC32 checksum in response headers.
        Used by replicas for initial synchronization and full state resync after compaction.
      servers:
        - url: http://127.0.0.1:8081
          description: Cluster HA listener
      security:
        - ClusterTokenAuth: []
      responses:
        '200':
          description: Raw Deflate compressed state snapshot stream.
          headers:
            X-Snapshot-Checksum:
              schema:
                type: string
                example: "a1b2c3d4"
              description: CRC32-IEEE checksum of the snapshot file.
            Content-Type:
              schema:
                type: string
                example: "application/octet-stream"
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/cluster/stream:
    get:
      operationId: getClusterStream
      tags:
        - Cluster Replication
      summary: Persistent WAL mutation stream (HTTP chunked)
      description: |
        Opens a continuous HTTP/1.1 chunked stream tailing `mutations.wal` from the specified byte offset.
        Replicas ingest mutations in real time to disk and in-memory radix tree simultaneously.
      servers:
        - url: http://127.0.0.1:8081
          description: Cluster HA listener
      security:
        - ClusterTokenAuth: []
      parameters:
        - name: offset
          in: query
          description: Byte offset in the WAL file to resume streaming from (default 0).
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
            example: 1048576
      responses:
        '200':
          description: Continuous chunked binary WAL stream.
          headers:
            X-Cluster-Generation:
              schema:
                type: integer
                example: 1
              description: Compaction generation counter on the Primary Hub.
            Content-Type:
              schema:
                type: string
                example: "application/octet-stream"
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '416':
          description: Offset beyond WAL boundary (compaction occurred, replica must resync snapshot).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: "Bearer token authentication header (Authorization: Bearer <API_TOKEN>)."
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: "Alternative API key header (X-API-Key: <API_TOKEN>)."
    ClusterTokenAuth:
      type: http
      scheme: bearer
      description: "Cluster authentication token (Authorization: Bearer <CLUSTER_TOKEN>)."

  responses:
    UnauthorizedError:
      description: Authentication failed or token missing.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: "unauthorized"

    ForbiddenReplicaError:
      description: Operation rejected because the node is running in read-only replica mode.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: "control plane is in read-only replica mode"

    BadRequestError:
      description: Invalid request payload, malformed DNS packet, or parameter error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: "invalid request payload"

    NotFoundError:
      description: Requested domain or zone was not found in the database.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: "domain not found"

    MethodNotAllowedError:
      description: HTTP method not allowed on this endpoint.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: "method not allowed"

    InternalServerError:
      description: Internal server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: "internal server error"

  schemas:
    Record:
      type: object
      required:
        - type
        - ttl
        - rdata
      properties:
        type:
          type: string
          description: DNS record type (e.g. A, AAAA, CNAME, TXT, MX, NS, SOA, SRV, CAA, PTR, TLSA, DS, DNSKEY, NSEC).
          example: "A"
        ttl:
          type: integer
          description: Time-To-Live in seconds (max 2147483647 per RFC 2181).
          minimum: 0
          maximum: 2147483647
          example: 300
        rdata:
          type: array
          description: Presentation text format values for the record set.
          items:
            type: string
          example:
            - "192.0.2.1"
            - "192.0.2.2"

    DomainRecords:
      type: object
      required:
        - domain
        - records
      properties:
        domain:
          type: string
          description: Fully-qualified domain name (FQDN).
          example: "example.com"
        records:
          type: array
          items:
            $ref: '#/components/schemas/Record'

    UpsertRequest:
      type: object
      required:
        - records
      properties:
        records:
          type: array
          description: List of record sets to set for the domain.
          items:
            $ref: '#/components/schemas/Record'
      example:
        records:
          - type: "A"
            ttl: 300
            rdata:
              - "192.0.2.100"
          - type: "TXT"
            ttl: 300
            rdata:
              - "v=spf1 -all"

    ListResponse:
      type: object
      required:
        - domains
        - has_more
      properties:
        next_cursor:
          type: string
          description: Cursor token to pass into the next page request.
          example: "sub.example.com"
        domains:
          type: array
          items:
            $ref: '#/components/schemas/DomainRecords'
        has_more:
          type: boolean
          description: True if additional pages exist.
          example: false

    SearchResponse:
      type: object
      required:
        - query
        - domains
        - total
      properties:
        query:
          type: string
          example: "api"
        total:
          type: integer
          example: 1
        domains:
          type: array
          items:
            $ref: '#/components/schemas/DomainRecords'

    StatusResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          example: "updated"
        domain:
          type: string
          example: "app.example.com"
        deleted:
          type: boolean
          example: false

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          example: "invalid record type"
